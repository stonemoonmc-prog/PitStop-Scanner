<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#050505">

  <title>Scanner PitStop</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #050505;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;

      background:
        radial-gradient(
          circle at 20% 10%,
          rgba(0, 102, 255, 0.13),
          transparent 32%
        ),
        radial-gradient(
          circle at 80% 15%,
          rgba(255, 0, 45, 0.11),
          transparent 32%
        ),
        radial-gradient(
          circle at 50% 100%,
          rgba(255, 0, 45, 0.08),
          transparent 38%
        ),
        #050505;

      color: white;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      text-align: center;

      overflow-x: hidden;
    }

    .page {
      width: 100%;
      max-width: 520px;

      margin: 0 auto;

      padding:
        max(18px, env(safe-area-inset-top))
        16px
        max(30px, env(safe-area-inset-bottom));
    }

    /* =========================
       LOGO
       ========================= */

    .logo-container {
      display: flex;
      justify-content: center;
      align-items: center;

      width: 100%;

      margin: 0 auto 8px;
    }

    .logo {
      display: block;

      width: 185px;
      max-width: 65vw;

      height: auto;

      margin: 0 auto;

      object-fit: contain;

      filter:
        drop-shadow(
          0 0 10px rgba(255, 0, 40, 0.35)
        )
        drop-shadow(
          0 0 14px rgba(0, 100, 255, 0.30)
        );
    }

    /* =========================
       TITRES
       ========================= */

    h1 {
      margin: 10px 0 5px;

      font-size: 32px;
      font-weight: 800;

      letter-spacing: 7px;

      text-shadow:
        0 0 9px rgba(0, 110, 255, 0.75),
        0 0 18px rgba(255, 20, 50, 0.30);
    }

    .subtitle {
      margin: 0 0 22px;

      color: rgba(255, 255, 255, 0.72);

      font-size: 16px;

      letter-spacing: 2px;
    }

    /* =========================
       CADRE SCANNER
       ========================= */

    .scanner-shell {
      position: relative;

      width: 100%;

      padding: 3px;

      border-radius: 28px;

      background:
        linear-gradient(
          90deg,
          #008cff 0%,
          #126cff 25%,
          #4b27ff 48%,
          #ff174d 75%,
          #ff123f 100%
        );

      box-shadow:
        -8px 0 28px rgba(0, 110, 255, 0.38),
        8px 0 28px rgba(255, 15, 55, 0.36);
    }

    .scanner-card {
      position: relative;

      width: 100%;

      min-height: 350px;

      border-radius: 25px;

      overflow: hidden;

      background: #090909;
    }

    #reader {
      width: 100%;

      min-height: 350px;

      background: #090909;
    }

    #reader video {
      width: 100% !important;

      height: 350px !important;

      object-fit: cover !important;

      border-radius: 25px;
    }

    #reader__scan_region {
      min-height: 350px !important;
    }

    #reader__dashboard {
      display: none !important;
    }

    /* =========================
       OVERLAY QR
       ========================= */

    .overlay {
      position: absolute;

      inset: 0;

      z-index: 10;

      pointer-events: none;

      display: flex;

      justify-content: center;
      align-items: center;
    }

    .qr-guide {
      position: relative;

      width: 225px;
      height: 225px;
    }

    .corner {
      position: absolute;

      width: 55px;
      height: 55px;
    }

    .corner-tl {
      top: 0;
      left: 0;

      border-top: 4px solid #19a4ff;
      border-left: 4px solid #19a4ff;

      border-radius: 15px 0 0 0;

      filter:
        drop-shadow(
          0 0 7px #008cff
        );
    }

    .corner-tr {
      top: 0;
      right: 0;

      border-top: 4px solid #ff244c;
      border-right: 4px solid #ff244c;

      border-radius: 0 15px 0 0;

      filter:
        drop-shadow(
          0 0 7px #ff174d
        );
    }

    .corner-bl {
      bottom: 0;
      left: 0;

      border-bottom: 4px solid #19a4ff;
      border-left: 4px solid #19a4ff;

      border-radius: 0 0 0 15px;

      filter:
        drop-shadow(
          0 0 7px #008cff
        );
    }

    .corner-br {
      bottom: 0;
      right: 0;

      border-bottom: 4px solid #ff244c;
      border-right: 4px solid #ff244c;

      border-radius: 0 0 15px 0;

      filter:
        drop-shadow(
          0 0 7px #ff174d
        );
    }

    .guide-center {
      position: absolute;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      width: 100%;
    }

    .qr-symbol {
      margin-bottom: 14px;

      font-size: 42px;

      color: rgba(255, 255, 255, 0.48);
    }

    .guide-text {
      color: rgba(255, 255, 255, 0.60);

      font-size: 12px;

      font-weight: 600;

      letter-spacing: 3px;

      line-height: 1.7;
    }

    /* =========================
       STATUS
       ========================= */

    .status-wrap {
      width: fit-content;

      max-width: 95%;

      margin: 27px auto 0;

      padding: 13px 20px;

      display: flex;

      justify-content: center;
      align-items: center;

      gap: 10px;

      background: rgba(18, 20, 24, 0.95);

      border: 1px solid #30343c;

      border-radius: 999px;

      box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.45);
    }

    .camera-icon {
      font-size: 19px;
    }

    #status {
      font-size: 14px;

      white-space: nowrap;
    }

    .status-dot {
      width: 11px;
      height: 11px;

      flex: 0 0 auto;

      border-radius: 50%;

      background: #00d85b;

      box-shadow:
        0 0 12px rgba(0, 216, 91, 0.9);
    }

    /* =========================
       FOOTER
       ========================= */

    .footer {
      margin-top: 38px;

      color: rgba(255, 255, 255, 0.34);

      font-size: 9px;

      letter-spacing: 2.5px;

      line-height: 1.8;
    }

    /* =========================
       IPHONE PETIT ÉCRAN
       ========================= */

    @media (max-width: 420px) {

      .page {
        padding-left: 12px;
        padding-right: 12px;
      }

      .logo {
        width: 165px;
      }

      h1 {
        font-size: 28px;

        letter-spacing: 6px;
      }

      .subtitle {
        font-size: 15px;
      }

      .scanner-card,
      #reader,
      #reader video,
      #reader__scan_region {
        min-height: 325px !important;
        height: 325px !important;
      }

      .qr-guide {
        width: 205px;
        height: 205px;
      }

      .guide-text {
        font-size: 11px;
      }

      #status {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <!-- LOGO PITSTOP -->

    <div class="logo-container">

      <img
        src="./ab3afe77-8eaa-4ff5-ac7a-ab0108bc952f.png"
        alt="Le PitStop Bar"
        class="logo"
      >

    </div>


    <!-- TITRE -->

    <h1>SCANNER</h1>

    <p class="subtitle">
      Scanne le billet
    </p>


    <!-- SCANNER -->

    <div class="scanner-shell">

      <div class="scanner-card">

        <div id="reader"></div>


        <!-- GUIDE QR -->

        <div class="overlay">

          <div class="qr-guide">

            <div class="corner corner-tl"></div>

            <div class="corner corner-tr"></div>

            <div class="corner corner-bl"></div>

            <div class="corner corner-br"></div>


            <div class="guide-center">

              <div class="qr-symbol">
                ▦
              </div>

              <div class="guide-text">
                PLACE LE QR CODE
                <br>
                ICI
              </div>

            </div>

          </div>

        </div>

      </div>

    </div>


    <!-- STATUS CAMÉRA -->

    <div class="status-wrap">

      <span class="camera-icon">
        📷
      </span>

      <span id="status">
        Ouverture de la caméra...
      </span>

      <span
        class="status-dot"
        id="statusDot"
      ></span>

    </div>


    <!-- FOOTER -->

    <div class="footer">
      GOOD DRINKS • GOOD PEOPLE • SAME PITSTOP
    </div>

  </main>


  <script>

    /* =========================
       WEBHOOK MAKE
       ========================= */

    const webhook =
      "https://hook.us2.make.com/pbyr9eb9vjpuc73syba8sxen9h8a8bjt";


    /* =========================
       ÉLÉMENTS
       ========================= */

    const statusText =
      document.getElementById("status");

    const statusDot =
      document.getElementById("statusDot");


    let scanned = false;


    const html5QrCode =
      new Html5Qrcode("reader");


    /* =========================
       STATUS
       ========================= */

    function setStatus(
      text,
      color = "#00d85b"
    ) {

      statusText.textContent = text;

      statusDot.style.background = color;

      statusDot.style.boxShadow =
        "0 0 12px " + color;
    }


    /* =========================
       QR DÉTECTÉ
       ========================= */

    function onScanSuccess(decodedText) {

      if (scanned) {
        return;
      }


      const ticket =
        decodedText.trim();


      /* Vérifie le format HAL26-XX */

      if (!ticket.startsWith("HAL26-")) {

        setStatus(
          "QR non valide",
          "#ff244c"
        );


        setTimeout(() => {

          setStatus(
            "Caméra arrière prête"
          );

        }, 1500);


        return;
      }


      scanned = true;


      setStatus(
        "Vérification du billet...",
        "#ffaa00"
      );


      /* Envoie le BILLET_ID à Make */

      window.location.href =
        webhook
        + "?ticket="
        + encodeURIComponent(ticket);
    }


    /* =========================
       ÉCHEC DE LECTURE
       ========================= */

    function onScanFailure(error) {

      /*
        Normal pendant que la caméra
        cherche un QR.
      */

    }


    /* =========================
       DÉMARRAGE CAMÉRA
       ========================= */

    function startScanner() {

      /*
        On essaie d'abord de forcer
        exactement la caméra arrière.
      */

      html5QrCode.start(

        {
          facingMode: {
            exact: "environment"
          }
        },

        {
          fps: 10,

          qrbox: {
            width: 225,
            height: 225
          },

          aspectRatio: 1.0
        },

        onScanSuccess,

        onScanFailure

      )

      .then(() => {

        setStatus(
          "Caméra arrière prête"
        );

      })

      .catch(error => {

        console.log(
          "Fallback caméra arrière",
          error
        );


        /*
          Si Safari refuse "exact",
          on demande simplement
          une caméra orientée arrière.
        */

        html5QrCode.start(

          {
            facingMode: "environment"
          },

          {
            fps: 10,

            qrbox: {
              width: 225,
              height: 225
            },

            aspectRatio: 1.0
          },

          onScanSuccess,

          onScanFailure

        )

        .then(() => {

          setStatus(
            "Caméra arrière prête"
          );

        })

        .catch(error => {

          console.error(
            "Erreur caméra",
            error
          );


          setStatus(
            "Impossible d'ouvrir la caméra",
            "#ff244c"
          );

        });

      });

    }


    /* =========================
       LANCEMENT
       ========================= */

    startScanner();

  </script>

</body>

</html>
