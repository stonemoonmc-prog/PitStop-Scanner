<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Scanner PitStop</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      max-width: 520px;
      margin: auto;
      padding: 24px 16px;
    }

    h1 {
      margin-bottom: 8px;
    }

    p {
      opacity: 0.85;
      font-size: 18px;
    }

    #reader {
      width: 100%;
      margin-top: 25px;
    }

    .status {
      margin-top: 20px;
      font-size: 16px;
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>🎟️ Scanner PitStop</h1>
    <p>Scanne le billet</p>

    <div id="reader"></div>

    <div class="status" id="status">
      Ouverture de la caméra...
    </div>
  </div>

  <script>
    const webhook =
      "https://hook.us2.make.com/pbyr9eb9vjpuc73syba8sxen9h8a8bjt";

    const statusText = document.getElementById("status");

    let scanned = false;

    const html5QrCode = new Html5Qrcode("reader");

    function onScanSuccess(decodedText) {
      if (scanned) return;

      const ticket = decodedText.trim();

      if (!ticket.startsWith("HAL26-")) {
        statusText.innerHTML = "❌ QR non valide";

        setTimeout(() => {
          statusText.innerHTML = "Scanne le billet";
        }, 1500);

        return;
      }

      scanned = true;

      statusText.innerHTML = "⏳ Vérification du billet...";

      window.location.href =
        webhook + "?ticket=" + encodeURIComponent(ticket);
    }

    function onScanFailure(error) {
      // On ignore les lectures ratées pendant que la caméra cherche un QR.
    }

    function startScanner() {
      html5QrCode.start(
        {
          facingMode: {
            exact: "environment"
          }
        },
        {
          fps: 10,
          qrbox: {
            width: 250,
            height: 250
          },
          aspectRatio: 1.0
        },
        onScanSuccess,
        onScanFailure
      )
      .then(() => {
        statusText.innerHTML = "📷 Caméra arrière prête";
      })
      .catch(err => {
        console.error("Erreur caméra :", err);

        // Petit fallback au cas où Safari refuse "exact".
        html5QrCode.start(
          {
            facingMode: "environment"
          },
          {
            fps: 10,
            qrbox: {
              width: 250,
              height: 250
            }
          },
          onScanSuccess,
          onScanFailure
        )
        .then(() => {
          statusText.innerHTML = "📷 Caméra arrière prête";
        })
        .catch(error => {
          console.error("Impossible d'ouvrir la caméra :", error);
          statusText.innerHTML =
            "❌ Impossible d'ouvrir la caméra. Vérifie les permissions Safari.";
        });
      });
    }

    startScanner();
  </script>

</body>
</html>
