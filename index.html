<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Scanner PitStop</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      max-width: 520px;
      margin: auto;
      padding: 24px 16px;
    }

    h1 {
      margin-bottom: 8px;
    }

    p {
      opacity: 0.85;
    }

    #reader {
      margin-top: 25px;
      width: 100%;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>🎟️ Scanner PitStop</h1>
    <p>Scanne le billet</p>

    <div id="reader"></div>
  </div>

  <script>
    const webhook =
      "https://hook.us2.make.com/pbyr9eb9vjpuc73syba8sxen9h8a8bjt";

    let scanned = false;

    function onScanSuccess(decodedText) {
      if (scanned) return;

      const ticket = decodedText.trim();

      if (!ticket.startsWith("HAL26-")) {
        alert("❌ QR NON VALIDE");
        return;
      }

      scanned = true;

      window.location.href =
        webhook + "?ticket=" + encodeURIComponent(ticket);
    }

    function onScanFailure(error) {
      // On ignore les lectures ratées
    }

    const scanner = new Html5QrcodeScanner(
      "reader",
      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        },
        rememberLastUsedCamera: true,
        supportedScanTypes: [
          Html5QrcodeScanType.SCAN_TYPE_CAMERA
        ]
      },
      false
    );

    scanner.render(onScanSuccess, onScanFailure);
  </script>

</body>
</html>
